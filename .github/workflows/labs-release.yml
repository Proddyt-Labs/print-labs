name: Labs release

# Proddyt Studio: builds on our self-hosted runner (proddyt server) to skip the free-tier queue.
# Linux is built natively; Windows is cross-compiled with cargo-xwin. macOS is not built here (no
# Mac hardware — see LABS-154). The Windows installer (Inno Setup) is the only step that still runs
# on a GitHub-hosted Windows runner, and only when publishing a release.
#
#   - push to main / schedule / dispatch with release=true  -> publish release (portable + installer)
#   - dispatch with release=false (default)                 -> build portable only, no release
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar release (portable + instalador). Desmarcado = só portable de teste."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: labs-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      app: ${{ steps.c.outputs.app }}
      tag: ${{ steps.c.outputs.tag }}
      is_release: ${{ steps.c.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(ls apps | grep -v -e '-cli$' -e '-web$' | head -1)
          echo "app=$app" >> "$GITHUB_OUTPUT"
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sha=$(git rev-parse --short HEAD)
          echo "tag=v${ver}-labs.$(date -u +%Y%m%d).${sha}" >> "$GITHUB_OUTPUT"
          # release on push/schedule, or on a dispatch that asked for it; a plain dispatch is a test
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" != "true" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi
          last=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$last" ] || ! echo "$last" | grep -q "$sha"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "main sem mudança desde $last"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: [self-hosted, proddyt]
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux (native) + Windows (cargo-xwin)
        shell: bash
        run: |
          source "$HOME/.cargo/env"
          app="${{ needs.check.outputs.app }}"
          cargo build --release -p "$app" -p "$app-cli"
          cargo xwin build --release --target x86_64-pc-windows-msvc -p "$app" -p "$app-cli"
      - name: Package portables
        shell: bash
        run: |
          app="${{ needs.check.outputs.app }}"; tag="${{ needs.check.outputs.tag }}"
          mkdir -p dist
          pack() { # <platdir> <srcdir> <ext>
            local out="dist/$1" src="$2" ext="$3"
            mkdir -p "$out"
            cp "$src/$app$ext" "$src/$app-cli$ext" "$out/"
            cp LICENSE-MIT LICENSE-APACHE "$out/" 2>/dev/null || true
            [ -f NOTICE ] && cp NOTICE "$out/" || true
            echo "$tag" > "$out/VERSION"
          }
          pack "$app-linux-x64"   target/release                            ""
          pack "$app-windows-x64" target/x86_64-pc-windows-msvc/release     ".exe"
          cd dist
          tar -czf "$app-linux-x64-portable.tar.gz" "$app-linux-x64"
          python3 -c "import shutil; shutil.make_archive('$app-windows-x64-portable','zip','.','$app-windows-x64')"
      - name: Upload portables + the unpacked Windows dir (for the installer)
        uses: actions/upload-artifact@v4
        with:
          name: portables
          path: |
            dist/*-portable.tar.gz
            dist/*-portable.zip
          retention-days: 14
      - name: Upload Windows dir
        if: needs.check.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-dir
          path: dist/${{ needs.check.outputs.app }}-windows-x64
          retention-days: 1

  installer:
    needs: [check, build]
    if: needs.check.outputs.build == 'true' && needs.check.outputs.is_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-dir
          path: dist/${{ needs.check.outputs.app }}-windows-x64
      - name: Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $app = "${{ needs.check.outputs.app }}"; $tag = "${{ needs.check.outputs.tag }}"
          $base = ($app -replace 'craft$','')
          # AppId keeps the old Switch name so existing installs upgrade in place (ADR 2026-10-14 marca Proddyt).
          $appId = (Get-Culture).TextInfo.ToTitleCase($base) + ' Labs'
          $nome = 'Studio ' + $(if ($base -eq 'cad') { 'CAD' } else { (Get-Culture).TextInfo.ToTitleCase($base) })
          $src = (Resolve-Path "dist/$app-windows-x64").Path
          Invoke-WebRequest "https://raw.githubusercontent.com/Proddyt-Labs/switch-tools/main/icons/$app.ico" -OutFile "$src\$app.ico"
          $iss = @(
            '[Setup]',
            "AppId=$appId",
            "AppName=$nome",
            "AppVersion=$tag",
            'AppPublisher=Proddyt Studio (fork of ArtCraft)',
            "DefaultDirName={localappdata}\Programs\Proddyt Studio\$nome",
            'DefaultGroupName=Proddyt Studio',
            'UsePreviousGroup=no',
            "SetupIconFile=$src\$app.ico",
            "UninstallDisplayIcon={app}\$app.ico",
            'PrivilegesRequired=lowest',
            'OutputDir=dist',
            "OutputBaseFilename=$app-windows-x64-setup",
            'Compression=lzma2',
            'SolidCompression=yes',
            '[Tasks]',
            'Name: desktopicon; Description: "Atalho na area de trabalho"',
            '[Files]',
            "Source: ""$src\*""; DestDir: ""{app}""; Flags: recursesubdirs",
            '[InstallDelete]',
            "Type: files; Name: ""{userprograms}\Proddyt Switch\$appId.lnk""",
            "Type: files; Name: ""{userdesktop}\$appId.lnk""",
            "Type: dirifempty; Name: ""{userprograms}\Proddyt Switch""",
            '[Icons]',
            "Name: ""{group}\$nome""; Filename: ""{app}\$app.exe""; IconFilename: ""{app}\$app.ico""",
            "Name: ""{userdesktop}\$nome""; Filename: ""{app}\$app.exe""; IconFilename: ""{app}\$app.ico""; Tasks: desktopicon",
            '[Run]',
            "Filename: ""{app}\$app.exe""; Description: ""Abrir $nome""; Flags: nowait postinstall skipifsilent"
          )
          $iss | Set-Content -Encoding utf8 setup.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*-setup.exe
          retention-days: 14

  release:
    needs: [check, build, installer]
    if: needs.check.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find assets -type f \( -name '*-portable.zip' -o -name '*-portable.tar.gz' -o -name '*-setup.exe' \))
          printf '%s\n' "${files[@]}"
          gh release create "${{ needs.check.outputs.tag }}" "${files[@]}" --target "$GITHUB_SHA" \
            --title "${{ needs.check.outputs.tag }}" \
            --notes "Build automático do Proddyt Studio ($(git rev-parse --short HEAD)). Linux/Windows no runner próprio; instalador no GitHub. Mudanças: features deste fork + sync do upstream."
