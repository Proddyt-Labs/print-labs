name: Labs release

# Proddyt Studio: builds this fork with the upstream's own packaging scripts (packaging/windows/
# package.ps1 and packaging/linux/package.sh, unsigned) and publishes a GitHub Release the app's
# built-in updater (craft-update, pointed at this repo) reads.
#
# Version: the upstream's M.m.p becomes M.m.(p*1000 + n), n = 1, 2, 3... per release of that p.
# Stable semver (the updater ignores pre-releases), always newer than the previous labs build and
# older than the next upstream patch. Fits the MSI ProductVersion (build <= 65535) while p <= 64.
#
# Molde: Proddyt-Labs/switch-tools/workflows/labs-release.yml (copy to each fork, don't edit there).
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: labs-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      app: ${{ steps.c.outputs.app }}
      base: ${{ steps.c.outputs.base }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app=$(ls apps | grep -v -e '-cli$' -e '-web$' -e '-worker$' | head -1)
          base=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)
          IFS=. read -r M m p <<< "${base%%-*}"
          n=0
          while read -r t; do
            [[ "$t" =~ ^v${M}\.${m}\.([0-9]+)$ ]] || continue
            x=${BASH_REMATCH[1]}
            if (( x / 1000 == p && x % 1000 > n )); then n=$(( x % 1000 )); fi
          done < <(gh release list -L 300 --json tagName -q '.[].tagName')
          version="$M.$m.$(( p * 1000 + n + 1 ))"
          echo "app=$app base=$base version=$version"
          { echo "app=$app"; echo "base=$base"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
          last_sha=$(gh release view --json targetCommitish -q .targetCommitish 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$last_sha" != "$GITHUB_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "main unchanged since the last release"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows }
          - { os: ubuntu-22.04, plat: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stamp the labs version
        shell: bash
        run: |
          set -euo pipefail
          sed -i "0,/^version = \"${{ needs.check.outputs.base }}\"/s//version = \"${{ needs.check.outputs.version }}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
          cargo update --workspace
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libfuse2 desktop-file-utils zsync
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:DIST = "$PWD\dist\release"
          pwsh packaging/windows/package.ps1 -Arch x64
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          export DIST="$PWD/dist/release"
          packaging/linux/package.sh --formats "appimage tar"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plat }}
          path: dist/release/*
          retention-days: 14

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find assets -maxdepth 1 -type f)
          printf '%s\n' "${files[@]}"
          v="${{ needs.check.outputs.version }}"
          gh release create "v$v" "${files[@]}" --target "$GITHUB_SHA" --latest \
            --title "v$v" \
            --notes "Proddyt Studio build of upstream ${{ needs.check.outputs.base }} + labs layer ($(git rev-parse --short HEAD)). Unsigned."
